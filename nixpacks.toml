# Railway/Nixpacks build configuration.
# These system libraries are required by weasyprint (HTML→PDF) and the matplotlib
# font stack. packages.txt (Streamlit Community Cloud convention) is NOT read by
# Nixpacks — this file is the equivalent for Railway/Render.
[phases.setup]
aptPkgs = [
  "libpango-1.0-0",
  "libpangoft2-1.0-0",
  "libharfbuzz0b",
  "libfribidi0",
  "libcairo2",
  "libgdk-pixbuf-2.0-0",
  "libffi-dev",
  "fonts-liberation",
]
